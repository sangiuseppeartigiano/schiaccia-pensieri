<div class="map-embed">

    [src]="safeMapUrl"
    loading="lazy"
    referrerpolicy="no-referrer-when-downgrade"
    [title]="'Mappa: ' + business.name"

  <a class="map-embed__link" [href]="business.address.mapsLinkUrl" target="_blank" rel="noopener">
    Apri in Google Maps →
  </a>
</div>
